<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia Charles Leco</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0D0D0D; color: #F2F2F2; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }

  h1, h2, h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; color: #F2F2F2; }

  /* HEADER AJUSTADO */
  header {
    position: fixed; width: 100%; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
    background: rgba(13,13,13,0.98); border-bottom: 1px solid #1A1A1A; z-index: 100;
  }
  header h1 { font-size: 24px; }
  nav { display: flex; gap: 30px; } /* AUMENTEI A DISTÂNCIA DOS BOTÕES */
  nav a { color: #B3B3B3; text-decoration: none; font-weight: 600; font-size: 14px; transition: 0.3s; }
  nav a:hover { color: #F2F2F2; }

  /* MENU MOBILE */
  @media (max-width: 768px) {
    header { flex-direction: column; padding: 15px 5%; gap: 12px; }
    nav { gap: 18px; flex-wrap: wrap; justify-content: center; }
    nav a { font-size: 12px; }
  }

  /* 1. HERO */
  .hero {
    height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(180deg, rgba(13,13,13,0.3) 0%, rgba(13,13,13,1) 100%),
    url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?q=80&w=2070') center/cover;
    padding-top: 80px;
  }
  .hero h2 { font-size: 90px; line-height: 1; margin-bottom: 20px; }
  .hero p { font-size: 18px; color: #B3B3B3; margin-bottom: 40px; max-width: 500px; margin-left: auto; margin-right: auto; }
  .btn-primary {
    background: #F2F2F2; color: #0D0D0D; padding: 16px 45px; text-decoration: none; font-weight: 700;
    border-radius: 0; transition: 0.3s; font-size: 14px; letter-spacing: 2px; display: inline-block;
  }
  .btn-primary:hover { background: #B3B3B3; }
  @media (max-width: 768px) {
    .hero h2 { font-size: 48px; }
    .hero p { font-size: 16px; padding: 0 20px; }
  }

  /* 2. SOBRE - RESPONSIVO: COLUNA NO MOBILE */
  section { padding: 100px 8%; }
  .sobre { 
    display: grid; 
    grid-template-columns: 1fr 1fr; /* DESKTOP: LADO A LADO */
    gap: 80px; 
    align-items: center; 
    background: #111
